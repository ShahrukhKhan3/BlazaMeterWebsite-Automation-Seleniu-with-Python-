[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pages/ and Test/ hold page objects and the flow orchestrator, not tests.
# Their Test_*.py / Test* / test_* names match the patterns above, so without
# this pytest collects all 17 page-object methods as standalone tests and fires
# them out of order. Imports still work; only collection is affected.
norecursedirs = Pages Test

addopts = --strict-markers

markers =
    api: tests that hit the REST API directly (no browser)
    ui: tests that drive a browser via Selenium
